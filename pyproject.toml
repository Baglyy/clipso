[project]
name = "clipso"
version = "0.1.0"
description = "Logiciel de montage vidéo (PyQt6)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W : style PEP 8, F : erreurs (imports inutilisés, noms inconnus), I : ordre des imports,
# B : pièges courants, UP : syntaxe Python moderne, N : conventions de nommage
select = ["E", "W", "F", "I", "B", "UP", "N"]
# les méthodes Qt surchargées (paintEvent, mousePressEvent…) sont en camelCase
ignore = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["view", "model", "controller"]

[tool.pytest.ini_options]
testpaths = ["view", "model", "controller"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["view", "model", "controller"]
omit = ["view/demo_data.py", "*/test_*.py"]